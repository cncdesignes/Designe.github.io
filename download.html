<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mera Download – CNC Design</title><style>html,body{margin:0;background:#0f1012;color:#f2efe8;font-family:Segoe UI,Arial,sans-serif}.w{max-width:760px;margin:auto;padding:24px 5%}h1{color:#e6c872}input,select{background:#17181b;border:1px solid #2d2e33;color:#f2efe8;padding:12px;font:inherit;border-radius:2px;width:100%;box-sizing:border-box;margin:6px 0}button,.b{background:#c9a24a;border:0;color:#16130b;font-weight:700;padding:11px 18px;cursor:pointer;border-radius:2px;font:inherit;font-weight:700;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}.o{background:transparent;border:1px solid #c9a24a;color:#c9a24a}.c{background:#17181b;border:1px solid #2d2e33;padding:14px;margin:10px 0}.m{color:#a49f94;font-size:13px}a{color:#e6c872}</style><script src="config.js"></script></head><body><div class="w">
<a href="./">← Website</a><h1>Mera Download</h1><p class="m">Apna order code likhein (jaise CNC-A1B2-C3D4-E5F6). Payment approve hone ke baad files yahan se download hongi.</p>
<input id="cd" placeholder="Order Code"><button onclick="ck()">Check Karein</button><div id="rs"></div></div>
<script>
var Q=new URLSearchParams(location.search).get('code');if(Q){document.getElementById('cd').value=Q}
function E(i){return document.getElementById(i)}
function H(p){return {apikey:SB.key,Authorization:'Bearer '+SB.key,'Content-Type':'application/json'}}
async function ck(){var r=E('rs'),c=E('cd').value.trim();if(!c)return;
 if(SB.key.indexOf('PASTE')==0){r.textContent='Setup abhi mukammal nahi hua.';return}
 r.textContent='Check ho raha hai...';
 try{var q=await fetch(SB.url+'/rest/v1/rpc/order_status',{method:'POST',headers:H(),body:JSON.stringify({p_code:c})});var j=await q.json();
  if(!q.ok||!j.length){r.innerHTML='<div class="c">Ye code nahi mila. Dobara check karein.</div>';return}
  var o=j[0];
  if(o.status=='pending'){r.innerHTML='<div class="c">⏳ Apki payment abhi check ho rahi hai. Thori der baad dobara check karein.<br><span class="m">Total: Rs. '+o.total+'</span></div>';return}
  if(o.status=='rejected'){r.innerHTML='<div class="c">❌ Payment verify nahi ho saki. Rabta karein: 03284452636</div>';return}
  var h='<div class="c">✅ Payment approve ho gayi. Files download karein:</div>';
  o.items.forEach(function(n){h+='<div class="c">'+n+'<br><button onclick="dl(\''+n+'\',this)">⬇ Download</button></div>'});r.innerHTML=h}
 catch(e){r.textContent='Network ka masla, dobara koshish karein'}}
async function dl(n,b){b.textContent='Link ban raha hai...';
 try{var q=await fetch(SB.url+'/functions/v1/get-download',{method:'POST',headers:H(),body:JSON.stringify({code:E('cd').value.trim(),item:n})});var j=await q.json();
  if(!q.ok||!j.url){b.textContent='❌ '+(j.error||'Error');return}
  b.textContent='⬇ Download';location.href=j.url}catch(e){b.textContent='Network masla'}}
if(Q)ck();
</script></body></html>
