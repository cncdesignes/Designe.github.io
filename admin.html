<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – CNC Design</title><style>html,body{margin:0;background:#0f1012;color:#f2efe8;font-family:Segoe UI,Arial,sans-serif}.w{max-width:760px;margin:auto;padding:24px 5%}h1{color:#e6c872}input,select{background:#17181b;border:1px solid #2d2e33;color:#f2efe8;padding:12px;font:inherit;border-radius:2px;width:100%;box-sizing:border-box;margin:6px 0}button,.b{background:#c9a24a;border:0;color:#16130b;font-weight:700;padding:11px 18px;cursor:pointer;border-radius:2px;font:inherit;font-weight:700;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}.o{background:transparent;border:1px solid #c9a24a;color:#c9a24a}.c{background:#17181b;border:1px solid #2d2e33;padding:14px;margin:10px 0}.m{color:#a49f94;font-size:13px}a{color:#e6c872}</style><script src="config.js"></script></head><body><div class="w">
<h1>Admin</h1>
<div id="lg"><input id="em" placeholder="Admin Email"><input id="pw" type="password" placeholder="Password"><button onclick="li()">Sign In</button><div id="le" class="m"></div></div>
<div id="ad" style="display:none"><button class="o" onclick="ld()">🔄 Refresh</button><button class="o" onclick="lo()">Sign Out</button><div id="ls"></div></div></div>
<script>
var TK=null;function E(i){return document.getElementById(i)}
function H(){return {apikey:SB.key,Authorization:'Bearer '+(TK||SB.key),'Content-Type':'application/json'}}
function X(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function li(){E('le').textContent='...';
 try{var q=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:E('em').value.trim(),password:E('pw').value})});var j=await q.json();
  if(!q.ok){E('le').textContent='Email ya password ghalat hai';return}
  TK=j.access_token;E('pw').value='';E('lg').style.display='none';E('ad').style.display='block';ld()}catch(e){E('le').textContent='Network masla'}}
function lo(){TK=null;E('ad').style.display='none';E('lg').style.display='block';E('ls').innerHTML=''}
async function ld(){var q=await fetch(SB.url+'/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:H()});var j=await q.json();
 if(!q.ok){E('ls').textContent='Orders nahi mile (admin email check karein)';return}
 var h='';if(!j.length)h='<p class="m">Abhi koi order nahi.</p>';
 j.forEach(function(o){var ph=o.phone.replace(/\D/g,'');if(ph[0]=='0')ph='92'+ph.slice(1);
  var msg=encodeURIComponent('Assalam o Alaikum '+o.customer_name+', apka order approve ho gaya hai. Code: '+o.code+'. Download: '+location.origin+location.pathname.replace('admin.html','download.html')+'?code='+o.code);
  h+='<div class="c"><b>'+X(o.code)+'</b> · '+({pending:'⏳ Pending',approved:'✅ Approved',rejected:'❌ Rejected'}[o.status])+'<br>'+X(o.customer_name)+' · '+X(o.phone)+'<br>'+X(o.items.join(', '))+'<br>Rs. '+o.total+' · '+X(o.method)+' · TxnID: <b>'+X(o.txn_id)+'</b><br><span class="m">'+new Date(o.created_at).toLocaleString()+'</span><br>'
  +(o.status!='approved'?'<button onclick="st(\''+o.id+'\',\'approved\')">Approve</button>':'')+(o.status=='pending'?'<button class="o" onclick="st(\''+o.id+'\',\'rejected\')">Reject</button>':'')+'<a class="b o" target="_blank" rel="noopener" href="https://wa.me/'+ph+'?text='+msg+'">WhatsApp</a></div>'});
 E('ls').innerHTML=h}
async function st(id,s){if(!confirm(s=='approved'?'Payment aap ne check kar li hai? Approve karein?':'Reject karein?'))return;
 var b={status:s};if(s=='approved')b.approved_at=new Date().toISOString();
 var q=await fetch(SB.url+'/rest/v1/orders?id=eq.'+id,{method:'PATCH',headers:Object.assign(H(),{Prefer:'return=minimal'}),body:JSON.stringify(b)});
 if(!q.ok)alert('Update nahi hua');ld()}
</script></body></html>
